<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101018" />
    <title>卡片勇者</title>
    <link rel="icon" href="data:," />
  </head>
  <body class="at-title">
    <main id="app">
      <div id="arena" class="arena"><div class="map-vignette"></div></div>
      <section id="start-screen" class="start-screen" aria-label="卡片勇者主菜单">
        <div class="title-emblem">
          <span class="title-spark one" aria-hidden="true">✦</span>
          <h1 aria-label="卡片勇者"><span aria-hidden="true">卡</span><span aria-hidden="true">片</span><span aria-hidden="true">勇</span><span aria-hidden="true">者</span></h1>
          <img class="menu-portrait menu-mermaid" data-menu-icon="base" alt="美人鱼" draggable="false" />
          <img class="menu-portrait menu-hero-blue" data-menu-icon="blue" alt="" draggable="false" />
          <img class="menu-portrait menu-hero-green" data-menu-icon="green" alt="" draggable="false" />
          <img class="menu-portrait menu-hero-purple" data-menu-icon="purple" alt="" draggable="false" />
          <span class="title-spark two" aria-hidden="true">✧</span>
        </div>
        <div class="title-actions">
          <button id="new-game" type="button">开始游戏</button>
          <button id="exit-game" type="button">退出游戏</button>
          <p id="menu-status" role="status"></p>
        </div>
      </section>
      <div class="hud">
        <div class="core-hud" title="守护美人鱼">
          <img id="base-avatar" alt="美人鱼" />
          <div class="core-meter">
            <div class="core-title">美人鱼<span>♥</span></div>
            <div class="health-track">
              <div id="base-health"></div>
              <b id="base-hp">1000 / 1000</b>
            </div>
          </div>
        </div>
        <div class="wave-hud">
          <div id="wave-progress" class="wave-progress" role="progressbar" aria-label="当天波次进度" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"></div>
          <button id="start" class="start-rune">
            <span id="start-label">⚑ 迎战</span>
          </button>
        </div>
        <div class="resources-hud">
          <div class="resource-counters">
          <div class="loot">
            <span class="gold-counter" title="金币"><i aria-hidden="true">Ⅰ</i> <b id="gold-total">0</b></span>
          </div>
          <div class="loot hero-counter" title="已上场英雄／上限（阵亡英雄仍占名额）" aria-label="已上场英雄 0 名，上限 6 名">
            <b id="hero-deployment-count">上场英雄 0/6</b>
          </div>
          </div>
          <div class="system-controls">
            <button id="sound" class="rune" title="关闭声音" aria-label="关闭声音" aria-pressed="true">♫</button>
            <button id="fullscreen" class="rune" title="全屏" aria-label="全屏" aria-pressed="false">⛶</button>
          </div>
        </div>
        <aside id="unit-inspector" class="unit-inspector" aria-label="选中单位属性" hidden>
          <div class="unit-heading">
            <img id="unit-icon" alt="" />
            <div><small id="unit-side"></small><strong id="unit-name"></strong></div>
          </div>
          <dl class="unit-stats">
            <div><dt>生命值</dt><dd id="unit-hp"></dd></div>
            <div><dt id="unit-power-label">攻击力</dt><dd id="unit-atk"></dd></div>
            <div><dt id="unit-rate-label">攻击速度</dt><dd><b id="unit-rate"></b><small>次/秒</small></dd></div>
            <div><dt id="unit-range-label">攻击距离</dt><dd><b id="unit-range"></b><small>格</small></dd></div>
            <div id="unit-crit-row"><dt>暴击率</dt><dd id="unit-crit"></dd></div>
          </dl>
        </aside>
        <aside id="unit-profile" class="unit-profile" aria-label="英雄等级与技能说明" hidden><span id="unit-role"></span><p id="unit-description"></p></aside>
        <div id="toast" role="status"></div>
        <div id="wave-banner"></div>
        <div id="map-hint" class="map-hint"></div>
        <section id="card-hud" aria-label="持有卡牌">
          <div class="hand-tray">
            <button id="hand-prev" class="hand-arrow" aria-label="前面的卡牌">
              ‹
            </button>
            <div id="hand"></div>
            <button id="hand-next" class="hand-arrow" aria-label="后面的卡牌">
              ›
            </button>
          </div>
        </section>
      </div>
    </main>
    <div id="scene-transition" aria-hidden="true" hidden></div>
    <dialog id="reward-dialog" aria-label="卡牌奖励五选二"></dialog>
    <dialog id="route-dialog" aria-label="选择关卡路线"></dialog>
    <dialog id="shop-dialog" aria-label="林间商店"></dialog>
    <dialog id="dialog">
      <button id="close-dialog" class="close-dialog" aria-label="关闭">
        ×
      </button>
      <div id="dialog-content"></div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
