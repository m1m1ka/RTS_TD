<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#183526" />
    <title>周五保卫战</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main id="app">
      <div id="arena" class="arena"><div class="map-vignette"></div></div>
      <div class="hud">
        <div class="core-hud" title="守护下班打卡机">
          <img id="base-avatar" alt="下班打卡机" />
          <div class="core-meter">
            <div class="core-title">下班打卡机<span>♥</span></div>
            <div class="health-track">
              <div id="base-health"></div>
              <b id="base-hp">1000 / 1000</b>
            </div>
          </div>
        </div>
        <div class="wave-hud">
          <div id="wave-progress" class="wave-progress" role="progressbar" aria-label="当天波次进度" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0"></div>
          <button id="start" class="start-rune">
            <span id="start-label">⚑ 迎战</span>
          </button>
        </div>
        <div class="resources-hud">
          <div class="loot">
            <span class="gold-counter" title="金币"><i aria-hidden="true">Ⅰ</i> <b id="gold-total">0</b></span>
            <span title="持有卡牌">▱</span><b id="cards-total">14</b
            ><span class="kill-counter" title="击退"
              >☠ <b id="kills">0</b></span
            >
          </div>
          <div class="system-controls">
            <button id="route-toggle" class="rune" title="远征路线" aria-label="打开远征路线">⚑</button>
            <a
              href="/config.html"
              target="_blank"
              rel="noopener"
              class="rune config-link"
              title="游戏配置"
              aria-label="打开游戏配置"
              >⚙</a
            >
            <button id="speed" class="rune" title="倍速">1×</button
            ><button id="sound" class="rune" title="声音">
              ♫<span class="sound-slash">/</span></button
            ><button id="help" class="rune" title="操作">?</button
            ><button id="restart" class="rune" title="重开">↻</button
            ><button id="pause" class="rune" title="暂停 · 空格">Ⅱ</button>
          </div>
        </div>
        <aside id="unit-inspector" class="unit-inspector" aria-label="选中单位属性" hidden>
          <div class="unit-heading">
            <img id="unit-icon" alt="" />
            <div><small id="unit-side"></small><strong id="unit-name"></strong></div>
          </div>
          <dl class="unit-stats">
            <div><dt>生命值</dt><dd id="unit-hp"></dd></div>
            <div><dt>攻击力</dt><dd id="unit-atk"></dd></div>
            <div><dt>攻击速度</dt><dd><b id="unit-rate"></b><small>次/秒</small></dd></div>
            <div><dt>攻击距离</dt><dd><b id="unit-range"></b><small>格</small></dd></div>
            <div><dt>暴击率</dt><dd id="unit-crit"></dd></div>
          </dl>
          <div id="unit-move-hint" class="unit-move-hint">◇ 可移动格子</div>
        </aside>
        <div id="toast" role="status"></div>
        <div id="wave-banner"></div>
        <div id="map-hint" class="map-hint"></div>
        <section id="card-hud" aria-label="持有卡牌">
          <div class="hand-tray">
            <button id="hand-prev" class="hand-arrow" aria-label="前面的卡牌">
              ‹
            </button>
            <div id="hand"></div>
            <button id="hand-next" class="hand-arrow" aria-label="后面的卡牌">
              ›
            </button>
          </div>
        </section>
      </div>
    </main>
    <dialog id="reward-dialog" aria-label="卡牌奖励五选二"></dialog>
    <dialog id="route-dialog" aria-label="选择关卡路线"></dialog>
    <dialog id="shop-dialog" aria-label="林间商店"></dialog>
    <dialog id="dialog">
      <button id="close-dialog" class="close-dialog" aria-label="关闭">
        ×
      </button>
      <div id="dialog-content"></div>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
